# ---------------------------------------------------------------------------
# Serving a client-routed single-page app.
#
# The one rule that matters is the fallback: /work/avernek is a route the
# router knows about and the filesystem does not, so any request that matches
# no file has to be answered with index.html rather than a 404. Everything
# else here is caching.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression was done at build time; serve those files rather than
    # spending CPU per request. `gzip on` stays as the fallback for anything
    # without a .gz twin.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml;

    # Hashed filenames. The content of /assets/index-a1b2c3d4.js can never
    # change, so it is safe to cache for a year and never revalidate.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Fonts are not hashed but they do not change either.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|webp|avif|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # index.html is the deploy pointer — it names the current asset hashes, so
    # it must never be held in a cache. Everything else being immutable only
    # works if this one file is always fresh.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # The SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No hidden files, ever.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
